name: Memory 2026 CI/CD Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test-memory-2026:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check JPEG
        run: |
          jpg_files=$(find . -name "*.jpg" -type f)

          for file in $jpg_files; do
            output=$(file "$file")
            if [[ $output != *"JPEG image data"* ]]; then
              echo "JPEG corrompu: $file"
              cp ./html/data/placeholder.jpg "$file"
              echo "Remplace $file avec ./html/data/placeholder.jpg"
            fi
          done

  build-memory-2026:
    needs: test-memory-2026
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build project
        run: |
          docker build -t edurn/memory-2026 .

  push-memory-2026:
    needs: build-memory-2026
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push edurn/memory-2026

  deploy-memory-2026:
    needs: push-memory-2026
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "~/memory-2026"
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/memory-2026
            cd ~/memory-2026
            docker compose pull || docker-compose pull
            docker compose down || docker-compose down || true
            docker compose up -d || docker-compose up -d
