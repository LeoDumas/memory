name: Memory 2026 CI/CD Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test-memory-2026:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check JPEG
        run: |
          jpg_files=$(find . -name "*.jpg" -type f)

          for file in $jpg_files; do
            output=$(file "$file")
            if [[ $output != *"JPEG image data"* ]]; then
              echo "JPEG corrompu: $file"
              cp ./html/data/placeholder.jpg "$file"
              echo "Remplace $file avec ./html/data/placeholder.jpg"
            fi
          done

  build-memory-2026:
    needs: test-memory-2026
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build project
        run: |
          docker build -t edurn/memory-2026 .

  push-memory-2026:
    needs: build-memory-2026
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push edurn/memory-2026

  deploy-memory-2026:
    needs: push-memory-2026
    runs-on: self-hosted
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull edurn/memory-2026
            docker stop memory-2026 || true
            docker rm memory-2026 || true
            docker run -d --name memory-2026 -p 80:80 edurn/memory-2026
