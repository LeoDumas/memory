name: Build memory 2026

on:
  workflow_run:
    workflows: ["Test memory 2026"]
    branches: [develop]
    types:
      - completed

jobs:
  build-memory-2026:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build project
        run: |
          docker build -t edurn/memory-2026 .
