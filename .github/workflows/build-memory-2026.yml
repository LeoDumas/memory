name: Build memory 2026

on:
  workflow_run:
    workflows: ["Test memory 2026"]
    types:
      - completed

jobs:
  build-memory-2026:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build project
        run: |
          docker build -t edurn/memory-2026 .
